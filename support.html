<h2>자주 묻는 질문</h2>
<p><b>앱을 꺼도 돈이 쌓이나요?</b><br>부업 수입은 앱을 꺼 둔 동안에도 최대 8시간치까지 쌓입니다.</p>
<p><b>처음부터 다시 하고 싶어요.</b><br>사직서를 내서 엔딩을 보면 "다시 입사하기"로 새로 시작할 수 있습니다. 엔딩 도감은 남습니다.</p>
<p><b>진행 기록이 사라졌어요.</b><br>기록은 기기 안에만 저장됩니다. 앱을 지웠다 다시 깔면 처음부터 시작합니다.</p>
